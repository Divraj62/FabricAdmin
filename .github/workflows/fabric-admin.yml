name: FabricAdmin validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path src -Recurse -Include *.ps1,*.psm1
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "$($file.FullName): $($parseErrors | Out-String)"
            }
          }
      - name: Compile Python notebook sources
        run: python3 -m py_compile docs/FabricNotebookExample.py notebooks/FabricAdmin_Ingestion.py